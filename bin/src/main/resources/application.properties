spring.application.name=Gestion-Turnos-Atencion-Usuarios

# PostgreSQL: la contraseña se lee de la variable de entorno DB_PASSWORD (no se publica en Git)
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_turnos_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crea database/01_esquema.sql; Hibernate solo verifica que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
